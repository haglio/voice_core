[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-core"
# The tag on the landing, read by setuptools-scm, so an app can name the copy
# it was built against.
dynamic = ["version"]
requires-python = ">=3.14"
# app_support at the tag this repo was built against; every other requirement
# with a ceiling, its floor what the family's machine holds today.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.153",
    "sounddevice>=0.5,<0.6",
    "vosk>=0.3,<0.4",
]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
    "vulture>=2.16,<3",
]

[tool.haglio]
siblings = ["app_support"]

[tool.setuptools.packages.find]
include = ["voice_core*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -p app_support.sanitize.pytest_plugin --timeout=60 --timeout-method=thread"
testpaths = ["tests"]
