[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-core"
# The tag on the landing, read by setuptools-scm, so an app can name the copy
# it was built against.
dynamic = ["version"]
requires-python = ">=3.14"
# Every requirement with a ceiling, its floor what the family's machine holds
# today. app_support is not among them: every app pins it itself, and pip refuses
# two pins of one repo that differ, so a pin here held every app to this repo's
# copy until this repo released again. Its own suite runs the copy the dev extra
# names.
dependencies = [
    "sounddevice>=0.5,<0.6",
    "vosk>=0.3,<0.4",
]

[tool.setuptools_scm]

[project.optional-dependencies]
# The verifying listener, and the reader taking speech down: an app that wants its
# commands double-checked, or speech taken down that no phrase list holds, asks for
# this; one that only hears a phrase list does not pay for it.
whisper = [
    "faster-whisper>=1,<2",
    "numpy>=2.4,<3",
]
dev = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.333",
    "numpy>=2.4,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
    "vulture>=2.16,<3",
]

[tool.haglio]
siblings = ["app_support"]

[tool.setuptools.packages.find]
include = ["voice_core*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -p app_support.sanitize.pytest_plugin -p app_support.gates.pytest_plugin -p app_support.coverage_gate --cov --cov-report= --timeout=60 --timeout-method=thread"
testpaths = ["tests"]
